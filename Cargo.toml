[package]
name = "setup-as-code"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Terraform for a personal AI assistant: one YAML manifest for identities, models, rules, tools, loops and safety policies. import, plan, verify, apply, lint."
license = "MIT"
repository = "https://github.com/Arephan/setup-as-code"
readme = "README.md"
keywords = ["agents", "claude-code", "dotfiles", "infrastructure-as-code", "cli"]
categories = ["command-line-utilities", "development-tools"]
default-run = "sac"

[lib]
name = "sac"
path = "src/lib.rs"

[[bin]]
name = "sac"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
home = "0.5"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.58", default-features = false }
owo-colors = "4"
plist = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.11"
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
