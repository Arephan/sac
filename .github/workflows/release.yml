name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sac dist/
          cp README.md LICENSE dist/
          tar -C dist -czf sac-${{ github.ref_name }}-${{ matrix.target }}.tar.gz sac README.md LICENSE
          shasum -a 256 sac-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > sac-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sac-*.tar.gz
            sac-*.sha256
